name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 2.0.0). Creates a draft release.'
        required: true
        type: string
      publish:
        description: 'Publish for real: creates the v<version> tag and a public release instead of a draft.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,   os: windows-latest, archive: zip }
          - { rid: linux-x64, os: ubuntu-latest,  archive: tar }
          - { rid: osx-x64,   os: macos-latest,   archive: tar }
          - { rid: osx-arm64, os: macos-latest,   archive: tar }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="${{ inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building Nmkoder $v for ${{ matrix.rid }}"

      - name: Publish
        shell: bash
        env:
          AVALONIA_TELEMETRY_OPTOUT: '1'
        run: |
          # Trimming stays off: Avalonia resolves XAML types by reflection at runtime.
          dotnet publish Nmkoder/Nmkoder.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:PublishTrimmed=false \
            -p:DebugType=none \
            -p:Version=${{ steps.ver.outputs.version }} \
            -o publish/Nmkoder

      - name: Bundle external tools
        shell: bash
        env:
          # Lets the script resolve "latest release" assets without hitting the
          # anonymous API rate limit shared by all runners.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/bundle-tools.sh ${{ matrix.rid }} publish/Nmkoder/bin | tee bundle.log
          # Downloads are best-effort, so record what actually landed in this build.
          {
            echo "### Bundled tools - ${{ matrix.rid }}"
            echo '```'
            cat bundle.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f bundle.log

      - name: Stage docs
        shell: bash
        run: cp README.md LICENSE publish/Nmkoder/

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path publish/Nmkoder -DestinationPath Nmkoder-${{ steps.ver.outputs.version }}-${{ matrix.rid }}.zip

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          chmod +x publish/Nmkoder/Nmkoder
          tar -czf Nmkoder-${{ steps.ver.outputs.version }}-${{ matrix.rid }}.tar.gz -C publish Nmkoder

      - uses: actions/upload-artifact@v4
        with:
          name: Nmkoder-${{ matrix.rid }}
          path: Nmkoder-*.${{ matrix.archive == 'zip' && 'zip' || 'tar.gz' }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            # Publishing from a dispatch creates the tag itself, which is the only route
            # when tags cannot be pushed from where the release is being cut.
            if [ "${{ inputs.publish }}" = "true" ]; then
              echo "draft=false" >> "$GITHUB_OUTPUT"
            else
              echo "draft=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Compose release notes
        shell: bash
        run: |
          cat > notes.md <<'NOTES'
            Portable builds of Nmkoder ${{ steps.ver.outputs.version }} (Avalonia UI on .NET 10).

            Unpack anywhere and run `Nmkoder`. No .NET install needed - the runtime is included.

            **Bundled tools.** Each archive lists exactly what it carries in
            `bin/THIRD-PARTY.txt`, with licences and sources. Bundling is best-effort:
            where a project publishes no binary for a platform, it is skipped rather than
            faked, so check that file rather than assuming.

            - Windows carries the most: ffmpeg/ffprobe, MKVToolNix, and what is available
              of the AV1AN tab's toolchain in `bin/av1an/` - VapourSynth with an embedded
              Python and its source plugins in `vsynth/`, encoders in `enc/`.
            - Linux includes ffmpeg/ffprobe; install VapourSynth and the encoders from
              your package manager.
            - macOS ships none of them; install with
              `brew install ffmpeg mkvtoolnix av1an svt-av1 aom libvpx x265`.

            Anything missing can be dropped into `bin/` yourself - av1an goes in
            `bin/av1an/`, encoders in `bin/av1an/enc/`, VapourSynth plugins in
            `bin/av1an/vsynth/vs-plugins/`.

            Anything placed in `bin/` takes priority over tools on your `PATH`.
          NOTES
          # The heredoc sits two columns deeper than the YAML block scalar's own indent.
          # Left in, continuation lines land at four columns and Markdown renders them as
          # code blocks.
          sed -i 's/^  //' notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Nmkoder ${{ steps.ver.outputs.version }}
          draft: ${{ steps.ver.outputs.draft }}
          generate_release_notes: true
          files: dist/*
          body_path: notes.md

      # action-gh-release only sets the body when it creates a release, so one that began
      # as a draft in an earlier run keeps that run's notes however often it is rebuilt -
      # which silently published notes describing a different set of bundled tools. Make
      # the workflow's text authoritative on every run.
      - name: Sync release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '\n**Full Changelog**: %s/%s/commits/%s\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "${{ steps.ver.outputs.tag }}" >> notes.md
          gh release edit "${{ steps.ver.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" --notes-file notes.md
