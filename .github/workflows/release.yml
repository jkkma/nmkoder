name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 2.0.0). Creates a draft release.'
        required: true
        type: string
      publish:
        description: 'Publish for real: creates the v<version> tag and a public release instead of a draft.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows builds the Windows-flavoured framework, which is the one carrying the Windows
          # App SDK and therefore real desktop notifications. It only exists on a Windows host, so
          # every other RID stays on plain net10.0 - see the csproj for why.
          #
          # Every RID publishes as one executable, and win-x64 is the expensive one. The App SDK's
          # single-file validation demands IncludeAllContentForSelfExtract, so that build unpacks
          # its whole bundle into %TEMP%\.net\Nmkoder\{bundle-id} at launch where the others
          # extract only their native libraries - measured on a linux-x64 bundle, 123 MB against
          # 49 MB. The id is a content hash, so each release writes its own folder rather than
          # reusing the last one's: that is how a machine came to be holding 5.22 GB over 40 of
          # them, and why win-x64 shipped as 224 loose DLLs for a few releases instead.
          #
          # Program.CleanupBundleExtractions is what pays for the bundle now. It reaps every
          # extraction but the live one on each launch, so the steady state is one folder rather
          # than one per release, and an upgrade collects its predecessor's. Measured on real
          # linux-x64 bundles built with this same flag: three planted folders deleted and its own
          # kept, then a 2.8.39 build freeing the 121.7 MB a 2.8.38 build had left.
          - { rid: win-x64,   os: windows-latest, archive: zip, tfm: net10.0-windows10.0.19041.0 }
          - { rid: linux-x64, os: ubuntu-latest,  archive: tar, tfm: net10.0 }
          - { rid: osx-x64,   os: macos-latest,   archive: tar, tfm: net10.0 }
          - { rid: osx-arm64, os: macos-latest,   archive: tar, tfm: net10.0 }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="${{ inputs.version }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building Nmkoder $v for ${{ matrix.rid }}"

      - name: Publish
        shell: bash
        env:
          AVALONIA_TELEMETRY_OPTOUT: '1'
        run: |
          # Trimming stays off: Avalonia resolves XAML types by reflection at runtime.
          dotnet publish Nmkoder/Nmkoder.csproj \
            -c Release \
            -f ${{ matrix.tfm }} \
            -r ${{ matrix.rid }} \
            --self-contained \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:PublishTrimmed=false \
            -p:DebugType=none \
            -p:Version=${{ steps.ver.outputs.version }} \
            -o publish/Nmkoder

      - name: Verify the data files survived publish
        shell: bash
        run: |
          # BinFiles/** has to land as loose files under bin/, because that is where the app reads
          # them back from. The Windows publish dropped them silently for three releases - the only
          # symptom is an empty argument grid on the encode tabs - so a build missing them fails here
          # instead of shipping.
          missing=0
          for f in bin/iso639.csv \
                   bin/encoderArgs/av1an/AomAv1.json \
                   bin/encoderArgs/av1an/SvtAv1.json \
                   bin/encoderArgs/av1an/Vpx.json \
                   bin/encoderArgs/av1an/X264.json \
                   bin/encoderArgs/av1an/X265.json \
                   bin/encoderArgs/ffmpeg/H264Nvenc.json \
                   bin/encoderArgs/ffmpeg/H265Nvenc.json \
                   bin/encoderArgs/ffmpeg/LibAomAv1.json \
                   bin/encoderArgs/ffmpeg/LibSvtAv1.json \
                   bin/encoderArgs/ffmpeg/LibVpx.json \
                   bin/encoderArgs/ffmpeg/Libx264.json \
                   bin/encoderArgs/ffmpeg/Libx265.json; do
            if [ ! -s "publish/Nmkoder/$f" ]; then
              echo "MISSING: $f"
              missing=1
            fi
          done
          if [ "$missing" != "0" ]; then
            echo "::error::Data files from BinFiles are missing from the ${{ matrix.rid }} publish output"
            exit 1
          fi
          echo "All BinFiles data present in the ${{ matrix.rid }} publish output."

      - name: Bundle external tools
        shell: bash
        env:
          # Lets the script resolve "latest release" assets without hitting the
          # anonymous API rate limit shared by all runners.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/bundle-tools.sh ${{ matrix.rid }} publish/Nmkoder/bin | tee bundle.log
          # Downloads are best-effort, so record what actually landed in this build.
          {
            echo "### Bundled tools - ${{ matrix.rid }}"
            echo '```'
            cat bundle.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f bundle.log

      - name: Verify ffmpeg and ffprobe actually landed
        # macOS bundles neither and leans on Homebrew, which is a deliberate trade rather than a
        # failure - see bundle-tools.sh. The two RIDs that are supposed to carry them must.
        if: matrix.rid == 'win-x64' || matrix.rid == 'linux-x64'
        shell: bash
        run: |
          # Bundling is best-effort by design, and this is the one tool that cannot be: an archive
          # without ffmpeg is not a working app, and every file loaded into it scans as having no
          # streams. It is checked here because the bundler's own report was wrong for eighteen
          # releases - bin/ffmpeg was a folder, cp refused, install_binary returned success anyway,
          # and 2.8.25 through 2.8.43 all shipped a linux-x64 archive with no ffmpeg in it while
          # the job summary said "[ok] ffmpeg + ffprobe". install_binary judges its own copy now;
          # this is the second pair of eyes, and it looks at what is in the folder rather than at
          # what the script says about it.
          missing=0

          for tool in ffmpeg ffprobe; do
            found=""

            for candidate in "publish/Nmkoder/bin/$tool" "publish/Nmkoder/bin/$tool.exe"; do
              [ -f "$candidate" ] && [ -s "$candidate" ] && found="$candidate"
            done

            if [ -z "$found" ]; then
              echo "MISSING: bin/$tool"
              [ -d "publish/Nmkoder/bin/$tool" ] && echo "  (bin/$tool is a directory - something is occupying the binary's name)"
              missing=1
            else
              echo "OK: $found ($(wc -c < "$found") bytes)"
            fi
          done

          if [ "$missing" != "0" ]; then
            echo "::error::${{ matrix.rid }} was built without a bundled ffmpeg/ffprobe"
            exit 1
          fi

      - name: Verify the QTGMC toolchain actually loads
        if: matrix.rid == 'win-x64'
        shell: bash
        run: |
          # Presence is not the test. eedi3m shipped in 2.8.3 and 2.8.4 as a perfectly valid,
          # correctly named, correctly exporting DLL that VapourSynth then refused to load, so
          # every QTGMC deinterlace on those builds quietly fell back to bwdif. Autoload failures
          # are silent by design, which is why this asks the bundled VapourSynth to build a real
          # QTGMC graph and render a frame of it - the same thing Nmkoder.Media.Qtgmc does per
          # session - and loads each plugin by hand when that fails, because LoadPlugin reports the
          # reason autoload swallows.
          #
          # And one preset is not the test either. havsfunc turns QTGMC's noise processing on for
          # Placebo and Very Slow and no other preset, which pulls in a denoiser plugin the rest of
          # them never touch - so a check that renders only a fast preset passes on a bundle that
          # has no fft3dfilter in it. That is exactly what 2.8.6 shipped. Every preset whose plugin
          # set differs gets rendered here; the clip is 160x120 and four frames, so the slow ones
          # cost seconds rather than the hours their names suggest.
          VS="publish/Nmkoder/bin/av1an/vsynth"

          if [ ! -f "$VS/python.exe" ]; then
            echo "::error::VapourSynth was not bundled, so QTGMC cannot work in this build"
            exit 1
          fi

          cat > "$VS/qtgmc-check.py" <<'CHECK'
          import glob, os, sys
          import vapoursynth as vs

          core = vs.core
          here = os.path.dirname(os.path.abspath(sys.argv[0]))

          # Keep in step with Nmkoder.Media.Qtgmc: the base set, plus the denoiser for the two
          # presets that process noise.
          BASE = ['mv', 'rgvs', 'fmtc', 'focus2', 'misc', 'znedi3', 'eedi3m']
          CASES = [('Very Fast', BASE), ('Very Slow', BASE + ['fft3dfilter'])]

          print('autoloaded namespaces:', ', '.join(sorted(p.namespace for p in core.plugins())))
          missing = sorted({n for _, need in CASES for n in need if not hasattr(core, n)})

          if missing:
              print('MISSING NAMESPACES:', ', '.join(missing))
              print('loading every plugin by hand, for the reason autoload does not give:')
              for dll in sorted(glob.glob(os.path.join(here, 'vs-plugins', '*.dll'))):
                  try:
                      core.std.LoadPlugin(path=dll)
                      print('   loaded  ', os.path.basename(dll))
                  except Exception as e:
                      print('   FAILED  ', os.path.basename(dll), '->', e)
              sys.exit(1)

          import havsfunc

          for preset, _ in CASES:
              clip = core.std.BlankClip(width=160, height=120, format=vs.YUV420P8, length=4,
                                        fpsnum=30000, fpsden=1001, color=[128, 128, 128])
              clip = core.std.SetFieldBased(clip, 2)
              clip = havsfunc.QTGMC(clip, Preset=preset, TFF=True, FPSDivisor=1, opencl=False)
              clip.get_frame(0)
              print(f'QTGMC rendered a frame at {preset}.')

          print('QTGMC works at every preset shape - the toolchain is complete.')
          CHECK

          ( cd "$VS" && ./python.exe qtgmc-check.py ) || {
            echo "::error::The bundled QTGMC toolchain does not work - see the plugin list above"
            rm -f "$VS/qtgmc-check.py"
            exit 1
          }
          rm -f "$VS/qtgmc-check.py"

      - name: Stage docs
        shell: bash
        run: cp README.md LICENSE publish/Nmkoder/

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path publish/Nmkoder -DestinationPath Nmkoder-${{ steps.ver.outputs.version }}-${{ matrix.rid }}.zip

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          chmod +x publish/Nmkoder/Nmkoder
          tar -czf Nmkoder-${{ steps.ver.outputs.version }}-${{ matrix.rid }}.tar.gz -C publish Nmkoder

      - uses: actions/upload-artifact@v4
        with:
          name: Nmkoder-${{ matrix.rid }}
          path: Nmkoder-*.${{ matrix.archive == 'zip' && 'zip' || 'tar.gz' }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the changelog below is built from the commit range
      # between the previous release and this one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            # Publishing from a dispatch creates the tag itself, which is the only route
            # when tags cannot be pushed from where the release is being cut.
            if [ "${{ inputs.publish }}" = "true" ]; then
              echo "draft=false" >> "$GITHUB_OUTPUT"
            else
              echo "draft=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Compose release notes
        shell: bash
        run: |
          cat > notes.md <<'NOTES'
            Portable builds of Nmkoder ${{ steps.ver.outputs.version }} (Avalonia UI on .NET 10).

            Unpack anywhere and run `Nmkoder`. No .NET install needed - the runtime is included.

            On Windows, [Scoop](https://scoop.sh) can do that for you - this repository doubles as
            a bucket, and updates in place from then on:

            ```
            scoop bucket add nmkoder https://github.com/jkkma/nmkoder
            scoop install nmkoder-avalonia
            ```

            (`nmkoder-avalonia`, not `nmkoder` - Scoop's `extras` bucket carries the
            pre-fork WinForms Nmkoder under that name.)

            **Bundled tools.** Each archive lists exactly what it carries in
            `bin/THIRD-PARTY.txt`, with licences and sources. Bundling is best-effort:
            where a project publishes no binary for a platform, it is skipped rather than
            faked, so check that file rather than assuming.

            - Windows carries the most: ffmpeg/ffprobe, MKVToolNix, and what is available
              of the AV1AN tab's toolchain in `bin/av1an/` - VapourSynth with an embedded
              Python and its source plugins in `vsynth/`, encoders in `enc/`. The QTGMC
              deinterlacer's plugins and scripts go in there too, which is what lets
              Quick Convert deinterlace a tape capture with it.
            - Linux includes ffmpeg/ffprobe; install VapourSynth and the encoders from
              your package manager. QTGMC additionally wants the mvtools, znedi3, eedi3m,
              fmtconv, rgvs, misc and focus2 plugins plus the havsfunc, vsutil and mvsfunc
              scripts - and fft3dfilter on top of those for the Placebo and Very Slow presets,
              the only two that denoise; without them Nmkoder deinterlaces with ffmpeg's bwdif
              and says so.
            - macOS ships none of them; install with
              `brew install ffmpeg mkvtoolnix av1an aom libvpx x265`.

            **SVT-AV1 is deliberately not in that brew line.** Nmkoder bundles the
            [svt-av1-hdr](https://github.com/juliobbv-p/svt-av1-hdr) build, which continues
            the SVT-AV1-PSY line, and the AV1AN tab's content presets are made of parameters
            only that line has. Homebrew's `svt-av1` is mainline and rejects them outright,
            so Nmkoder drops them and says so in the log. Build svt-av1-hdr and put
            `SvtAv1EncApp` on your `PATH` to get those presets as intended.

            Anything missing can be dropped into `bin/` yourself - av1an goes in
            `bin/av1an/`, encoders in `bin/av1an/enc/`, VapourSynth plugins in
            `bin/av1an/vsynth/vs-plugins/`.

            Anything placed in `bin/` takes priority over tools on your `PATH`.
          NOTES
          # The heredoc sits two columns deeper than the YAML block scalar's own indent.
          # Left in, continuation lines land at four columns and Markdown renders them as
          # code blocks.
          sed -i 's/^  //' notes.md

          # The changelog goes in the release itself. A link out to the commits page is not a
          # changelog: it needs the reader to leave, and it shows whatever the branch holds now
          # rather than what went into this version. Appended after the sed above so these lines
          # keep their own indentation.
          tag="${{ steps.ver.outputs.tag }}"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            prev="$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)"   # Tag exists: range ends at it
            range="${prev:+$prev..}$tag"
          else
            prev="$(git describe --tags --abbrev=0 2>/dev/null || true)"           # Dispatch: the tag is created later
            range="${prev:+$prev..}HEAD"
          fi

          {
            echo
            echo "## Changes${prev:+ since $prev}"
            echo
            git log --no-merges --pretty=format:'- %s' $range
            echo
          } >> notes.md

          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Nmkoder ${{ steps.ver.outputs.version }}
          draft: ${{ steps.ver.outputs.draft }}
          # Our notes carry the changelog, and the sync step below overwrites the body anyway,
          # so GitHub's generated section would only ever be discarded.
          generate_release_notes: false
          files: dist/*
          body_path: notes.md

      # action-gh-release only sets the body when it creates a release, so one that began
      # as a draft in an earlier run keeps that run's notes however often it is rebuilt -
      # which silently published notes describing a different set of bundled tools. Make
      # the workflow's text authoritative on every run.
      - name: Sync release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "${{ steps.ver.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" --notes-file notes.md

      # Point the Scoop bucket in this repo at the release that has just been published. The zip
      # is already here as a build artifact, so hashing it costs nothing - Scoop's own autoupdate
      # arrives at the same number by re-downloading 400-odd MB, and only whenever something next
      # happens to run it. Doing it here means the manifest is never a release behind.
      #
      # A draft is not a release anyone can install, so it leaves the manifest where it is.
      - name: Point the Scoop manifest at this release
        if: steps.ver.outputs.draft == 'false'
        shell: bash
        run: |
          v="${{ steps.ver.outputs.version }}"
          zip="dist/Nmkoder-$v-win-x64.zip"

          if [ ! -s "$zip" ]; then
            echo "::error::$zip is missing, so the Scoop manifest cannot be updated"
            exit 1
          fi

          hash="$(sha256sum "$zip" | cut -d' ' -f1)"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/${{ steps.ver.outputs.tag }}/Nmkoder-$v-win-x64.zip"

          # The checkout above is at whatever ref triggered this - the tag itself on a tag push,
          # which is a detached HEAD with nowhere to commit to. The manifest belongs on the
          # default branch either way.
          branch="${{ github.event.repository.default_branch }}"
          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"

          jq --indent 4 --arg v "$v" --arg url "$url" --arg hash "$hash" \
            '.version = $v | .architecture."64bit".url = $url | .architecture."64bit".hash = $hash' \
            bucket/nmkoder-avalonia.json > bucket/nmkoder-avalonia.json.new
          mv bucket/nmkoder-avalonia.json.new bucket/nmkoder-avalonia.json

          if git diff --quiet -- bucket/nmkoder-avalonia.json; then
            echo "The Scoop manifest already describes $v - nothing to do."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Point the Scoop manifest at $v" -- bucket/nmkoder-avalonia.json

          # A push landing on the branch between the fetch above and this one is the one failure
          # worth retrying: this commit touches a single file nothing else writes, so rebasing it
          # onto whatever arrived and pushing again resolves it.
          for attempt in 1 2 3; do
            if git push origin "$branch"; then
              echo "Scoop manifest updated to $v."
              exit 0
            fi
            # Trailing `|| true` because the step runs under `set -e`: a failed fetch or rebase
            # would otherwise end the run here, past the error message below.
            git fetch origin "$branch" && git rebase "origin/$branch" || true
          done

          echo "::error::Could not push the updated Scoop manifest to $branch"
          exit 1
